<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taiyi-AGI (太乙因果机) 20.3 v7.21 — TYIDO MVE实验·太一接口·AGI自我意识·苏格拉底拓扑网络 STN</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
:root{
  --bg:#09090f; --bg2:#111118; --bg3:#1a1a26; --bg4:#22222e;
  --acc:#7c3aed; --acc2:#a78bfa; --acc-glow:rgba(124,58,237,.25);
  --green:#10b981; --amber:#f59e0b; --red:#ef4444; --sky:#38bdf8;
  --txt:#e8e8f0; --txt2:#8888a0; --txt3:#555566; --bdr:#252535;
  --wood:#22c55e; --fire:#ef4444; --earth:#eab308; --metal:#94a3b8; --water:#3b82f6;
  --si:#8b5cf6; --sg:#06b6d4; --sc:#f472b6;
  --grow:#06b6d4; --patch:#f97316; --goal:#fbbf24;
  /* 介质共振专属色 */
  --medium:#e879f9; --medium-glow:rgba(232,121,249,.2);
  --xinzhai:#34d399; --phase-high:#fbbf24; --phase-low:#64748b;
  /* 四象模态色 */
  --mode-rigid:#ef4444; --mode-boil:#f97316; --mode-pilgrim:#3b82f6; --mode-entropy:#8b5cf6;
  --r:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}

/* ═══════════════════════════════════════════════════════════════
   三栏布局结构
   ┌──────────┬──────────────────────┬──────────────┐
   │ 左侧面板  │     中间对话区域       │  右侧DAG图   │
   │ (分析仪表)│                      │              │
   │  - 熵    │  - 输入框            │  问答关系链  │
   │  - 五行  │  - 对话历史          │              │
   │  - 锚定  │                      │              │
   └──────────┴──────────────────────┴──────────────┘
═══════════════════════════════════════════════════════════════ */
#app{display:flex;height:100vh;flex-direction:column}
#topbar{
  height:52px;background:var(--bg2);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:20
}
#main{flex:1;display:flex;overflow:hidden}

/* 顶栏样式 */
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo{font-size:22px;animation:spin 20s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:15px;font-weight:700;letter-spacing:.5px}
.version-badge{
  background:linear-gradient(135deg,var(--acc),#4f46e5);
  color:#fff;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;
}
.theory-badge{
  background:var(--bg3);color:var(--sky);border:1px solid var(--sky);
  padding:2px 8px;border-radius:20px;font-size:10px;
}
.dot-ok{width:8px;height:8px;border-radius:50%;background:var(--green)}
.dot-loading{width:8px;height:8px;border-radius:50%;background:var(--amber);
  animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.spacer{flex:1}
.header-actions{display:flex;gap:8px;align-items:center}
.mode-toggle{
  display:flex;background:var(--bg3);border-radius:8px;padding:3px;gap:2px;
}
.mode-btn{
  padding:5px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;
  font-family:inherit;background:transparent;color:var(--txt2);transition:all .2s;
}
.mode-btn.active{background:var(--acc);color:#fff}
.btn-reset{
  background:var(--bg3);border:1px solid var(--bdr);color:var(--txt2);
  padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;
}
.btn-reset:hover{background:var(--bg4)}

/* ═══════════════════════════════════════════════════════════════
   左侧面板（分析仪表盘）- 宽度320px
═══════════════════════════════════════════════════════════════ */
#left-panel{
  width:320px;background:var(--bg2);border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden;
}
#left-panel::-webkit-scrollbar{width:4px}
#left-panel::-webkit-scrollbar-track{background:transparent}
#left-panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.panel-header{
  padding:10px 14px;border-bottom:1px solid var(--bdr);flex-shrink:0;
  display:flex;align-items:center;gap:8px;
}
.panel-header-title{font-size:12px;font-weight:700;color:var(--txt)}

#mode-section{padding:10px 14px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.mode-tabs{display:flex;gap:4px;margin-bottom:8px}
.mode-tab{
  flex:1;padding:6px 4px;border:1px solid var(--bdr);border-radius:6px;
  background:var(--bg3);cursor:pointer;text-align:center;font-size:10px;
  color:var(--txt2);transition:all .2s;
}
.mode-tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}

#main-input{
  width:100%;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:var(--r);color:var(--txt);padding:10px;font-size:12px;
  resize:none;height:68px;font-family:inherit;outline:none;line-height:1.5;
}
#main-input:focus{border-color:var(--acc)}
#goal-input{
  width:100%;background:var(--bg3);border:1px solid var(--goal);
  border-radius:var(--r);color:var(--txt);padding:10px;font-size:12px;
  resize:none;height:68px;font-family:inherit;outline:none;line-height:1.5;
}
#goal-input:focus{border-color:var(--goal);box-shadow:0 0 0 3px rgba(251,191,36,.15)}
.input-row{display:flex;gap:6px;margin-top:6px}
.btn-send{
  flex:1;padding:8px 12px;background:var(--acc);border:none;border-radius:6px;
  color:#fff;font-size:12px;cursor:pointer;font-family:inherit;
  transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-send:hover{opacity:.85;transform:translateY(-1px);box-shadow:0 4px 12px var(--acc-glow)}
.btn-send:active{transform:translateY(0);opacity:1}
.btn-send.loading{background:var(--amber);pointer-events:none}
.btn-send .btn-text{font-weight:600}
.btn-send .btn-hint{font-size:9px;opacity:.7;background:rgba(0,0,0,0.2);padding:1px 4px;border-radius:3px}
.btn-goal{
  width:100%;margin-top:6px;padding:8px;background:linear-gradient(135deg,var(--goal),#f59e0b);
  border:none;border-radius:6px;color:#000;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.btn-goal:hover{opacity:.85;transform:translateY(-1px)}
.btn-goal:active{transform:translateY(0);opacity:1}

.panel-section{padding:10px 14px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.panel-title{
  font-size:10px;color:var(--txt2);margin-bottom:8px;
  display:flex;align-items:center;gap:6px;font-weight:600;
}

/* 三相熵仪表 */
.entropy-bars{display:flex;flex-direction:column;gap:6px}
.entropy-row{display:flex;align-items:center;gap:6px}
.entropy-label{font-size:10px;width:20px;color:var(--txt2)}
.entropy-bar-wrap{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.entropy-bar{height:100%;border-radius:4px;transition:width .5s ease}
.bar-si{background:var(--si)}.bar-sg{background:var(--sg)}.bar-sc{background:var(--sc)}
.entropy-value{font-size:10px;width:45px;text-align:right;color:var(--txt)}

/* 五行仪表 */
.five-phase-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.element-card{
  background:var(--bg3);border-radius:6px;padding:6px 2px;text-align:center;
  border:1px solid transparent;
}
.element-card.wood{border-color:var(--wood)}
.element-card.fire{border-color:var(--fire)}
.element-card.earth{border-color:var(--earth)}
.element-card.metal{border-color:var(--metal)}
.element-card.water{border-color:var(--water)}
.element-icon{font-size:14px}
.element-name{font-size:8px;color:var(--txt2);margin-top:2px}
.element-value{font-size:12px;font-weight:700;margin-top:2px}
.element-card.wood .element-value{color:var(--wood)}
.element-card.fire .element-value{color:var(--fire)}
.element-card.earth .element-value{color:var(--earth)}
.element-card.metal .element-value{color:var(--metal)}
.element-card.water .element-value{color:var(--water)}

/* 锚定验证 */
.anchor-status{display:flex;align-items:center;gap:8px;margin-top:6px}
.anchor-indicator{width:10px;height:10px;border-radius:50%;background:var(--green)}
.anchor-indicator.warning{background:var(--amber)}.anchor-indicator.danger{background:var(--red)}
.anchor-text{font-size:10px;color:var(--txt)}
.anchor-details{
  margin-top:6px;font-size:9px;color:var(--txt2);
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
}
.anchor-item{
  background:var(--bg3);padding:3px 6px;border-radius:4px;
  display:flex;align-items:center;gap:4px;
}
.anchor-dot{width:5px;height:5px;border-radius:50%}
.anchor-dot.ok{background:var(--green)}.anchor-dot.fail{background:var(--red)}

/* 陈天桥测试模块样式 */
#chen-test-panel{
  flex-shrink:0;
  max-height:45%;overflow-y:auto;
  background:linear-gradient(180deg, var(--bg2) 0%, rgba(124,58,237,0.15) 100%);
  border-left:4px solid var(--acc);
  min-height:150px;
}
#chen-test-panel::-webkit-scrollbar{width:4px}
#chen-test-panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.chen-panel-highlight{
  box-shadow:0 -4px 12px rgba(124,58,237,0.25);  /* 顶部阴影 */
  background: rgba(124,58,237, 0.1);  /* 背景高亮 */
}
#chen-container {
  min-height: 100px;  /* 确保容器有高度 */
  background: rgba(124,58,237, 0.05);  /* 浅紫色背景 */
}
.chen-test-header{
  padding:10px 14px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:8px;
  background:var(--bg3);
}
.chen-test-title{font-size:12px;font-weight:700;color:var(--txt);flex:1}
.chen-test-badge{
  background:var(--acc);color:#fff;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;
}
.chen-test-body{padding:8px 14px}
.chen-test-mode-tabs{display:flex;gap:4px;margin-bottom:8px}
.chen-mode-tab{
  flex:1;padding:5px 4px;border:1px solid var(--bdr);border-radius:5px;
  background:var(--bg3);cursor:pointer;text-align:center;font-size:9px;color:var(--txt2);
}
.chen-mode-tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.chen-question-card{
  background:var(--bg3);border-radius:6px;padding:8px;margin-bottom:8px;
  border:1px solid var(--bdr);
}
.chen-q-num{font-size:9px;color:var(--acc2);margin-bottom:4px;font-weight:600}
.chen-q-text{font-size:11px;color:var(--txt);line-height:1.5;margin-bottom:8px}
.chen-options{display:flex;flex-direction:column;gap:4px}
.chen-option{
  padding:5px 8px;background:var(--bg);border:1px solid var(--bdr);
  border-radius:4px;cursor:pointer;font-size:10px;color:var(--txt2);
  transition:all .15s;
}
.chen-option:hover{border-color:var(--acc2);color:var(--txt)}
.chen-option.selected{border-color:var(--acc);background:var(--acc-glow);color:var(--txt)}
.chen-option.correct{border-color:var(--green);background:rgba(16,185,129,.15);color:var(--green)}
.chen-option.wrong{border-color:var(--red);background:rgba(239,68,68,.15);color:var(--red)}
.chen-actions{display:flex;gap:6px;margin-top:8px}
.chen-btn{
  flex:1;padding:6px;border:none;border-radius:5px;cursor:pointer;
  font-size:10px;font-family:inherit;font-weight:600;
}
.chen-btn-start{background:var(--acc);color:#fff}
.chen-btn-next{background:var(--bg4);color:var(--txt);border:1px solid var(--bdr)}
.chen-btn-submit{background:var(--green);color:#fff}
.chen-progress{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.chen-progress-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.chen-progress-fill{height:100%;background:var(--acc);transition:width .3s}
.chen-progress-text{font-size:9px;color:var(--txt2);min-width:45px;text-align:right}
.chen-result{
  text-align:center;padding:12px;background:var(--bg3);border-radius:8px;
  margin-top:8px;
}
.chen-result-score{font-size:24px;font-weight:700;color:var(--acc);margin-bottom:4px}
.chen-result-label{font-size:10px;color:var(--txt2)}

/* 对话栏测试样式 */
.msg-chen-test{
  background:var(--bg2);border:1px solid var(--amber);
  border-radius:var(--r);padding:12px;max-width:100%;
}
.chen-test-question{margin-top:8px}
.chen-test-q-text{
  font-size:13px;line-height:1.6;margin-bottom:10px;
  color:var(--txt);
}
/* ═════════════════════════════════════════════════════════════
   AI进度指示器弹窗
═════════════════════════════════════════════════════════════ */
#ai-progress-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.8);z-index:1000;
  display:none;justify-content:center;align-items:center;
  backdrop-filter:blur(6px);
}
#ai-progress-overlay.active{display:flex}
.ai-progress-modal{
  background:var(--bg2);border:2px solid var(--acc);border-radius:20px;
  padding:40px 48px;min-width:450px;max-width:520px;
  box-shadow:0 0 60px rgba(124,58,237,0.4),0 0 120px rgba(124,58,237,0.1);
  animation:modalFadeIn 0.4s cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalFadeIn{
  from{opacity:0;transform:translateY(-30px) scale(0.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.ai-progress-icon{
  text-align:center;font-size:48px;margin-bottom:16px;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ai-progress-title{
  font-size:18px;font-weight:700;color:var(--acc2);
  margin-bottom:8px;text-align:center;letter-spacing:0.5px;
}
.ai-progress-status{
  font-size:13px;color:var(--txt);margin-bottom:20px;
  text-align:center;line-height:1.6;
}
.ai-progress-bar-wrap{
  width:100%;height:14px;background:var(--bg3);
  border-radius:7px;overflow:hidden;margin-bottom:16px;
  border:1px solid var(--bdr);position:relative;
}
.ai-progress-bar-fill{
  height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2),#c084fc);
  border-radius:7px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);
  width:0%;position:relative;
}
.ai-progress-bar-fill::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  animation:shimmer 2s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.ai-progress-percent{
  text-align:center;font-size:32px;font-weight:800;color:var(--acc2);
  margin-bottom:12px;font-variant-numeric:tabular-nums;
}
.ai-progress-detail{
  font-size:12px;color:var(--txt2);text-align:center;
  margin-bottom:20px;line-height:1.8;
  background:var(--bg3);padding:10px 14px;border-radius:8px;
}
.ai-progress-detail span{color:var(--acc2);font-weight:600}
.ai-progress-spinner{
  display:flex;justify-content:center;gap:6px;margin-bottom:20px;
}
.ai-progress-spinner .s-dot{
  width:10px;height:10px;border-radius:50%;background:var(--acc2);
  animation:dotBounce 1.2s infinite ease-in-out;
}
.s-dot:nth-child(2){animation-delay:0.15s}
.s-dot:nth-child(3){animation-delay:0.3s}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.1)}}
.ai-progress-cancel{
  display:block;margin:0 auto;padding:8px 28px;
  background:var(--bg3);border:1px solid var(--bdr);
  color:var(--txt2);border-radius:8px;cursor:pointer;font-size:12px;
  transition:all 0.2s;
}
.ai-progress-cancel:hover{background:var(--bg4);color:var(--txt);border-color:var(--red)}

.chen-test-options{
  display:flex;flex-direction:column;gap:6px;
}
.chen-test-option{
  display:flex;align-items:flex-start;gap:8px;
  padding:8px 10px;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:6px;cursor:pointer;transition:all .15s;
}
.chen-test-option:hover{
  border-color:var(--amber);background:var(--bg4);
}
.chen-test-option.selected{
  border-color:var(--amber);background:rgba(251,191,36,.15);
}
.chen-opt-letter{
  background:var(--amber);color:#000;width:20px;height:20px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.chen-opt-text{font-size:12px;color:var(--txt);line-height:1.4}
.chen-test-nav{
  display:flex;justify-content:space-between;margin-top:12px;
}
.chen-nav-btn{
  background:var(--bg3);border:1px solid var(--bdr);
  color:var(--txt2);padding:6px 12px;border-radius:5px;
  cursor:pointer;font-size:11px;transition:all .15s;
}
.chen-nav-btn:hover{background:var(--bg4);color:var(--txt)}

/* AI自动答题状态 */
.ai-thinking{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;background:rgba(124,58,237,.1);
  border:1px solid var(--acc);border-radius:6px;margin-top:10px;
  font-size:11px;color:var(--acc2);
}
.ai-thinking-dot{
  width:8px;height:8px;border-radius:50%;background:var(--acc);
  animation:pulse .8s ease-in-out infinite;
}
.ai-selected{
  border-color:var(--green) !important;
  background:rgba(16,185,129,.15) !important;
}

/* 测试报告样式 */
.msg-chen-report{
  background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(124,58,237,.1));
  border:2px solid var(--amber);border-radius:12px;padding:16px;max-width:100%;
}
.chen-report-body{text-align:center}
.chen-report-score{
  font-size:48px;font-weight:700;color:var(--amber);line-height:1;
}
.chen-report-score span{font-size:16px;font-weight:400;margin-left:4px}
.chen-report-level{
  font-size:18px;margin:8px 0;color:var(--txt);
}
.chen-report-detail{
  display:flex;justify-content:center;gap:20px;margin:12px 0;
}
.chen-report-item{
  display:flex;flex-direction:column;gap:2px;font-size:11px;
}
.chen-report-item span:first-child{color:var(--txt2)}
.chen-report-item span:last-child{color:var(--txt);font-weight:600}
.chen-report-actions{margin-top:12px}

/* 答案详解样式 */
.msg-chen-cat{
  background:var(--bg3);border:1px solid var(--bdr);
  padding:8px 12px;max-width:100%;
}
.msg-chen-answer{
  background:var(--bg2);padding:10px 12px;margin:4px 0;
  border-radius:6px;max-width:100%;
}

/* 模块分析面板 */
#analysis-panel{
  background:var(--bg2);max-height:200px;overflow-y:auto;
  border-top:1px solid var(--bdr);flex-shrink:0;
}
#analysis-panel::-webkit-scrollbar{width:3px}
#analysis-panel::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.analysis-item{padding:5px 0;border-bottom:1px solid var(--bdr);font-size:11px}
.analysis-key{color:var(--acc2);font-weight:600}
.analysis-val{color:var(--txt)}
.analysis-nested{margin-left:10px;padding-left:6px;border-left:2px solid var(--bdr)}

/* 全息离散治理可视化 - 五层结构 */
.five-layer-visual {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px;
  background: var(--bg3);
  border-radius: 6px;
  margin: 6px 0;
}
.five-layer-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.layer-label {
  width: 70px;
  font-size: 10px;
  font-weight: 600;
  color: var(--txt2);
}
.layer-bar-wrap {
  flex: 1;
  height: 8px;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
}
.layer-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s ease;
}
.layer-bar.l1 { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
.layer-bar.l2 { background: linear-gradient(90deg, #8b5cf6, #a855f7); }
.layer-bar.l3 { background: linear-gradient(90deg, #a855f7, #d946ef); }
.layer-bar.l4 { background: linear-gradient(90deg, #d946ef, #ec4899); }
.layer-bar.l5 { background: linear-gradient(90deg, #ec4899, #f43f5e); }
.layer-value {
  width: 35px;
  font-size: 10px;
  text-align: right;
  color: var(--txt);
}

/* 厚度δ仪表盘 */
.thickness-gauge {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  background: var(--bg3);
  border-radius: 6px;
  margin: 6px 0;
}
.gauge-circle {
  position: relative;
  width: 50px;
  height: 50px;
}
.gauge-circle svg {
  transform: rotate(-90deg);
}
.gauge-bg {
  fill: none;
  stroke: var(--bg);
  stroke-width: 5;
}
.gauge-fill {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
}
.gauge-fill.low { stroke: #22c55e; }
.gauge-fill.medium { stroke: #eab308; }
.gauge-fill.high { stroke: #ef4444; }
.gauge-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 12px;
  font-weight: 700;
  color: var(--txt);
}
.gauge-info {
  flex: 1;
}
.gauge-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--txt);
}
.gauge-trend {
  font-size: 10px;
  color: var(--txt2);
  margin-top: 2px;
}

/* 治理模式指示器 */
.governance-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  margin: 4px 2px;
}
.governance-badge.stable { background: rgba(34,197,94,0.2); color: #22c55e; }
.governance-badge.adapting { background: rgba(59,130,246,0.2); color: #3b82f6; }
.governance-badge.transitioning { background: rgba(234,179,8,0.2); color: #eab308; }
.governance-badge.critical { background: rgba(239,68,68,0.2); color: #ef4444; }

/* 帧跃迁指示器 */
.frame-transition {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  background: var(--bg3);
  border-radius: 4px;
  font-size: 10px;
  margin: 4px 0;
}
.transition-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: pulse 1s infinite;
}
.transition-dot.active { background: #22c55e; }
.transition-dot.inactive { background: var(--bdr); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* 全息治理分隔标题 */
.hdg-section-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--acc2);
  margin: 8px 0 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--bdr);
}

/* ═══════════════════════════════════════════════════════════════
   中间对话区域 - flex:1自适应
═══════════════════════════════════════════════════════════════ */
#center-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);
  min-width:0;
}
.center-header{
  height:44px;padding:0 16px;background:var(--bg2);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}
.center-title{font-size:12px;font-weight:600;color:var(--txt)}
.qa-badge{
  background:var(--acc-glow);color:var(--acc2);padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:600;
}
.spacer-center{flex:1}
.btn-clear{
  background:var(--bg3);border:1px solid var(--bdr);color:var(--txt2);
  padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;
}
.btn-clear:hover{background:var(--bg4)}

#history{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
#history::-webkit-scrollbar{width:3px}
#history::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.msg{border-radius:var(--r);padding:10px 12px;font-size:12.5px;line-height:1.6}
.msg-user{background:var(--acc-glow);border:1px solid rgba(124,58,237,.3);
  color:var(--txt);align-self:flex-end;max-width:85%}
.msg-ai{background:var(--bg2);border:1px solid var(--bdr);color:var(--txt);max-width:100%}

/* ═══ 关联追问样式（类ChatGPT/元宝）═══ */
.related-questions{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bdr)}
.related-questions .rq-title{font-size:10px;color:var(--txt2);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.related-questions .rq-title::before{content:'💡';font-size:11px}
.related-questions .rq-list{display:flex;flex-direction:column;gap:5px}
.related-questions .rq-item{
  padding:6px 10px;background:var(--bg3);border:1px solid var(--bdr);border-radius:8px;
  font-size:12px;color:var(--txt);cursor:pointer;transition:all .2s;line-height:1.4;
}
.related-questions .rq-item:hover{
  background:var(--acc-glow);border-color:var(--acc);color:#fff;
  transform:translateX(3px);box-shadow:0 2px 8px rgba(124,58,237,.2)
}
.related-questions .rq-item::before{content:'→ ';color:var(--acc);font-weight:600}
.msg-goal{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}
.msg-meta{font-size:9px;color:var(--txt2);margin-bottom:3px}
.msg-goal-badge{
  background:rgba(251,191,36,.2);color:var(--goal);padding:1px 5px;
  border-radius:10px;font-size:9px;display:inline-block;margin-bottom:3px;
}
.msg-node-badge{
  background:rgba(6,182,212,.2);color:var(--grow);padding:1px 5px;border-radius:10px;font-size:9px;
}
.thinking{display:flex;gap:4px;align-items:center;padding:4px 0}
.dot1,.dot2,.dot3{width:5px;height:5px;border-radius:50%;background:var(--acc2);
  animation:bounce 1s infinite}
.dot2{animation-delay:.15s}.dot3{animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

.input-section{
  padding:10px 16px 12px;background:var(--bg2);
  border-top:1px solid var(--bdr);flex-shrink:0;
}
.input-tabs{display:flex;gap:4px;margin-bottom:8px}
.input-tab{
  padding:5px 12px;border:1px solid var(--bdr);border-radius:5px;
  background:var(--bg3);cursor:pointer;font-size:10px;color:var(--txt2);
}
.input-tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.input-area textarea{
  width:100%;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:var(--r);color:var(--txt);padding:10px;font-size:13px;
  resize:none;height:80px;font-family:inherit;outline:none;line-height:1.5;
}
.input-area textarea:focus{border-color:var(--acc)}

/* ═══════════════════════════════════════════════════════════════
   右侧DAG关系图 - 宽度520px（放大）
═══════════════════════════════════════════════════════════════ */
#right-column{
  width:520px;background:var(--bg2);border-left:1px solid var(--bdr);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden
}
#right-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  border-top:2px solid var(--bdr);
}
.right-header{
  height:44px;padding:0 14px;background:var(--bg2);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.right-title{font-size:12px;font-weight:600;color:var(--txt)}
.right-icon{font-size:14px}
.rel-badge{
  background:var(--sky);color:#000;padding:2px 7px;border-radius:10px;
  font-size:9px;font-weight:600;
}
.btn-dag-toggle{
  background:none;border:none;color:var(--txt2);
  font-size:10px;cursor:pointer;padding:2px 6px;border-radius:4px;
  transition:all .15s;
}
.btn-dag-toggle:hover{background:var(--bg4);color:var(--txt)}
.btn-dag-fullscreen{
  background:none;border:none;color:var(--txt2);
  font-size:13px;cursor:pointer;padding:2px 6px;border-radius:4px;
  transition:all .15s;margin-left:auto;
}
.btn-dag-fullscreen:hover{background:var(--bg4);color:var(--acc)}

/* DAG全屏覆盖层 */
#dag-fullscreen-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:rgba(9,9,15,.95);z-index:9999;
  display:none;flex-direction:column;overflow:hidden;
}
#dag-fullscreen-overlay.active{display:flex}
#dag-fullscreen-header{
  height:48px;padding:0 20px;background:var(--bg2);
  border-bottom:1px solid var(--bdr);display:flex;
  align-items:center;gap:12px;flex-shrink:0;
}
#dag-fullscreen-header .fs-title{
  font-size:14px;font-weight:600;color:var(--txt);
}
#dag-fullscreen-header .fs-badge{
  background:var(--sky);color:#000;padding:2px 10px;
  border-radius:10px;font-size:10px;font-weight:600;
}
#dag-fullscreen-header .fs-close{
  margin-left:auto;background:none;border:1px solid var(--bdr);
  color:var(--txt2);font-size:12px;cursor:pointer;
  padding:4px 12px;border-radius:5px;transition:all .15s;
}
#dag-fullscreen-header .fs-close:hover{
  background:var(--red);color:#fff;border-color:var(--red);
}
#dag-fullscreen-body{
  flex:1;position:relative;
  overflow:auto;
  padding:20px;
}
#dag-fullscreen-body::-webkit-scrollbar{
  width:10px;height:10px;
}
#dag-fullscreen-body::-webkit-scrollbar-track{
  background:var(--bg2);border-radius:5px;
}
#dag-fullscreen-body::-webkit-scrollbar-thumb{
  background:var(--bdr);border-radius:5px;
}
#dag-fullscreen-body::-webkit-scrollbar-thumb:hover{
  background:var(--txt2);
}
#dag-fullscreen-body::-webkit-scrollbar-corner{
  background:var(--bg2);
}
#dag-fullscreen-svg{
  min-width:900px;min-height:600px;
}
#dag-fullscreen-body .dag-empty-state{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
}

#dag-container{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
#dag-svg{width:100%;height:100%}

.dag-empty-state{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--txt3);
}
.dag-empty-icon{font-size:42px;margin-bottom:10px;opacity:.4}
.dag-empty-text{font-size:12px}

.dag-node{fill:var(--bg3);stroke:var(--acc);stroke-width:2;rx:6;cursor:pointer}
.dag-node:hover{filter:brightness(1.2)}
.dag-node-user{fill:rgba(124,58,237,.2);stroke:var(--acc)}
.dag-node-ai{fill:rgba(16,185,129,.15);stroke:var(--green)}
.dag-node-goal{fill:rgba(251,191,36,.15);stroke:var(--goal)}
.dag-link{stroke:var(--bdr);stroke-width:1.5;fill:none;opacity:.6}
.dag-link-ref{stroke:var(--sky);stroke-width:1.5;stroke-dasharray:3,2;opacity:.7}
.dag-link-follow{stroke:var(--grow);stroke-width:1.5;opacity:.7}
.dag-label{font-size:10px;fill:var(--txt);pointer-events:none}
.dag-label-q{font-size:9px;fill:var(--acc2);font-weight:600}
.dag-label-a{font-size:9px;fill:var(--green)}
.dag-time{font-size:8px;fill:var(--txt3)}
.dag-badge{font-size:9px;fill:#fff;font-weight:600}

/* ═══════════════════════════════════════════════════════════════
   STN 苏格拉底拓扑网络 — Phase 1 样式
   ══════════════════════════════════════════════════════════════ */
/* 面包屑导航 */
#stn-breadcrumb{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;min-height:30px;
  background:var(--bg2);border-bottom:1px solid var(--bdr);
  font-size:11px;color:var(--txt2);flex-shrink:0;
  overflow-x:auto;white-space:nowrap;
}
#stn-breadcrumb::-webkit-scrollbar{height:0}
.stn-bc-item{
  cursor:pointer;color:var(--sky);padding:2px 6px;
  border-radius:4px;transition:all .15s;font-size:11px;
}
.stn-bc-item:hover{background:var(--bg3);color:var(--acc2)}
.stn-bc-item.active{color:var(--txt);background:var(--bg3);font-weight:600}
.stn-bc-sep{color:var(--txt3);margin:0 1px;font-size:11px}

/* DAG 活跃路径高亮 */
.dag-node-stn-active{stroke:var(--acc2)!important;stroke-width:3!important;
  filter:drop-shadow(0 0 6px var(--acc-glow))!important}
.dag-link-stn-active{stroke:var(--acc2)!important;stroke-width:2!important;opacity:.9!important}
.dag-node-stn-path{stroke:var(--acc)!important;stroke-width:2}

/* S/E 节点类型徽章 */
.dag-badge-s{fill:var(--grow)!important}
.dag-badge-e{fill:#f97316!important}

/* 折叠指示器 */
.dag-collapse-btn{
  cursor:pointer;font-size:9px;fill:var(--txt2);
  transition:fill .15s;
}
.dag-collapse-btn:hover{fill:var(--acc2)}

/* 消息分叉标签 */
.msg-fork-badge{
  display:inline-block;font-size:9px;padding:1px 5px;
  background:rgba(168,85,247,.2);color:#a855f7;
  border-radius:8px;margin-left:4px;vertical-align:middle;
}

/* 历史视图中的活跃节点指示 */
.msg-stn-active{
  border-left:3px solid var(--acc2)!important;
  background:rgba(124,58,237,.06)!important;
}

/* ═══════════════════════════════════════════════════════════════
   STN Phase 2 — 分叉与多版本样式
   ══════════════════════════════════════════════════════════════ */
/* 消息悬停操作按钮组 */
.msg-hover-actions{
  position:absolute;right:6px;top:4px;display:flex;gap:4px;
  opacity:0;transition:opacity .2s;z-index:5;
}
.msg:hover .msg-hover-actions{opacity:1}
.msg-action-btn{
  width:22px;height:22px;border:none;border-radius:4px;
  background:var(--bg3);color:var(--txt2);font-size:11px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;line-height:1;
}
.msg-action-btn:hover{background:var(--acc);color:#fff}
.msg-action-btn.fork-btn:hover{background:#a855f7;color:#fff}

/* 版本切换器 */
.version-switcher{
  display:flex;align-items:center;gap:3px;margin:4px 0 2px 0;
}
.version-dot{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--bdr);
  background:transparent;cursor:pointer;font-size:9px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;color:var(--txt3);
}
.version-dot:hover{border-color:var(--acc);color:var(--acc)}
.version-dot.active{border-color:var(--acc2);background:rgba(124,58,237,.15);color:var(--acc2);font-weight:700}
.version-label{font-size:9px;color:var(--txt3);margin-right:2px}

/* DAG 分叉连线（紫色虚线） */
.dag-link-fork{stroke:#a855f7!important;stroke-width:1.5!important;
  stroke-dasharray:4,3!important;opacity:.7!important}

/* ═══════════════════════════════════════════════════════════════
   STN Phase 3 — 流贯控制台样式
   ══════════════════════════════════════════════════════════════ */
#ftel-console{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;min-height:38px;
  background:var(--bg2);border-top:1px solid var(--bdr);
  font-size:11px;flex-shrink:0;
}
.console-entropy{
  display:flex;align-items:center;gap:4px;
}
.console-entropy-track{
  width:60px;height:6px;border-radius:3px;background:var(--bg3);
  overflow:hidden;
}
.console-entropy-fill{
  height:100%;border-radius:3px;transition:width .5s, background .3s;
  background:var(--green);
}
.console-entropy-fill.warn{background:var(--amber)}
.console-entropy-fill.danger{background:#ef4444}
.console-entropy-val{
  font-size:9px;color:var(--txt3);min-width:28px;
}
.console-btns{display:flex;gap:4px}
.console-btn{
  padding:2px 8px;border:1px solid var(--bdr);border-radius:4px;
  background:transparent;color:var(--txt2);font-size:10px;
  cursor:pointer;transition:all .15s;
}
.console-btn:hover{background:var(--bg3);color:var(--acc);border-color:var(--acc)}
.console-cmd-input{
  flex:1;padding:3px 8px;border:1px solid var(--bdr);
  border-radius:4px;background:var(--bg1);color:var(--txt);
  font-size:11px;outline:none;transition:border-color .2s;
}
.console-cmd-input:focus{border-color:var(--acc)}
.console-cmd-input::placeholder{color:var(--txt3)}
.console-status{
  font-size:9px;color:var(--txt3);min-width:60px;text-align:right;
}

/* ═══════════════════════════════════════════════════════════════
   STN Phase 4 — 视觉润色样式
   ══════════════════════════════════════════════════════════════ */
/* ELENCHUS 锯齿线（通过JS在renderDAG中实现SVG zigzag path） */
.dag-link-elenchus{stroke:#f97316!important;stroke-width:1.5!important;fill:none!important}

/* 节点微徽章 */
.dag-micro-badge{
  font-size:8px;font-weight:700;pointer-events:none;
}

/* 新节点涟漪动画 */
@keyframes nodeRipple{
  0%{r:0;opacity:.6}
  100%{r:20;opacity:0}
}
.dag-ripple{
  fill:none;stroke:var(--acc2);stroke-width:2;
  animation:nodeRipple .8s ease-out forwards;
}

/* 选中节点发光脉冲 */
@keyframes nodeGlowPulse{
  0%,100%{filter:drop-shadow(0 0 4px var(--acc-glow))}
  50%{filter:drop-shadow(0 0 10px var(--acc-glow))}
}
.dag-node-glow-pulse{animation:nodeGlowPulse 2s ease-in-out infinite}

/* DAG 背景网格 */
.dag-bg-grid line{stroke:var(--bdr);stroke-width:.5;opacity:.3}

/* 摘要消息样式 */
.msg-summary{
  background:rgba(74,222,128,.05)!important;
  border-left:3px solid var(--grow)!important;
}
.msg-elenchus{
  background:rgba(249,115,22,.05)!important;
  border-left:3px solid #f97316!important;
}

/* 自动摘要提示 */
.auto-summary-hint{
  font-size:9px;color:var(--txt3);padding:2px 8px;
  background:rgba(74,222,128,.08);border-radius:4px;
  margin-top:4px;cursor:pointer;
}
.auto-summary-hint:hover{background:rgba(74,222,128,.15);color:var(--grow)}

/* ═══════════════════════════════════════════════════════════════
   Agent行为分析面板样式（Agentic RL 白盒化）
   工具调用分布 / 推理轨迹 / GC代币消耗趋势
═════════════════════════════════════════════════════════════ */
.panel-agent-behavior{border-left:2px solid #22d3ee}

/* 工具调用分布条 */
.behavior-tool-row{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:8px}
.behavior-tool-name{width:50px;color:var(--txt2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.behavior-tool-bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.behavior-tool-bar{height:100%;border-radius:3px;transition:width .4s ease}
.behavior-tool-val{width:24px;font-size:8px;color:var(--txt);text-align:right;flex-shrink:0}

/* 推理轨迹条 */
.behavior-trace{display:flex;flex-direction:column;gap:1px;max-height:60px;overflow-y:auto;margin:4px 0;padding:3px;background:var(--bg3);border-radius:4px}
.behavior-trace::-webkit-scrollbar{width:3px}
.behavior-trace::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
.behavior-trace-step{display:flex;align-items:center;gap:4px;padding:1px 4px;font-size:8px;border-radius:2px}
.behavior-trace-step:hover{background:var(--bg4)}
.trace-step-num{width:14px;color:var(--txt3);flex-shrink:0}
.trace-step-type{width:32px;font-weight:600;flex-shrink:0}
.trace-step-type.think{color:#a78bfa}
.trace-step-type.tool{color:#22d3ee}
.trace-step-type.answer{color:#34d399}
.trace-step-type.error{color:#ef4444}
.trace-step-brief{flex:1;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* GC代币消耗趋势迷你图 */
.behavior-gc-chart{height:32px;background:var(--bg3);border-radius:4px;margin:4px 0;overflow:hidden;position:relative}
.behavior-gc-chart canvas{width:100%;height:100%}

/* 行为统计卡片 */
.behavior-stats{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:4px 0}
.behavior-stat-card{background:var(--bg3);border-radius:4px;padding:3px 6px;text-align:center}
.behavior-stat-label{font-size:7px;color:var(--txt3)}
.behavior-stat-val{font-size:11px;font-weight:700;color:var(--txt)}

/* 奖励趋势 */
.behavior-reward{display:flex;align-items:center;gap:4px;font-size:8px;padding:2px 6px;background:var(--bg3);border-radius:4px;margin:2px 0}
.behavior-reward-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.behavior-reward-label{color:var(--txt2);flex:1}
.behavior-reward-val{font-weight:600}

#dag-footer{
  padding:8px 14px;background:var(--bg2);
  border-top:1px solid var(--bdr);flex-shrink:0;
  display:flex;align-items:center;gap:10px;font-size:10px;color:var(--txt2);
}
.dag-stat{display:flex;align-items:center;gap:3px}
.dag-dot{width:7px;height:7px;border-radius:50%}
.dot-q{background:var(--acc)}.dot-a{background:var(--green)}
.dot-ref{background:var(--sky)}.dot-follow{background:var(--grow)}

#tooltip{position:absolute;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:6px;padding:8px 12px;font-size:11px;line-height:1.6;
  max-width:260px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:50}

/* Hint提示系统 */
[data-hint]{
  position:relative;
  cursor:help;
}
[data-hint]:hover::after{
  content:attr(data-hint);
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  background:var(--bg4);
  color:var(--txt);
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
  line-height:1.5;
  white-space:pre-wrap;
  max-width:280px;
  z-index:1000;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  border:1px solid var(--acc);
  pointer-events:none;
  animation:hintFadeIn .2s ease;
}
[data-hint]:hover::before{
  content:'';
  position:absolute;
  bottom:calc(100% + 2px);
  left:50%;
  transform:translateX(-50%);
  border:6px solid transparent;
  border-top-color:var(--acc);
  z-index:1000;
  pointer-events:none;
}
@keyframes hintFadeIn{
  from{opacity:0;transform:translateX(-50%) translateY(4px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}

/* 顶部文档入口 */
.doc-entry{
  display:flex;gap:6px;align-items:center;
}
.btn-doc{
  background:var(--bg3);border:1px solid var(--acc);
  color:var(--acc2);padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:11px;font-family:inherit;
  display:flex;align-items:center;gap:4px;
  transition:all .2s;
}
.btn-doc:hover{background:var(--acc);color:#fff}
.btn-help{
  background:var(--bg3);border:1px solid var(--bdr);
  color:var(--txt2);padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:11px;font-family:inherit;
  display:flex;align-items:center;gap:4px;
  transition:all .2s;
}
.btn-help:hover{background:var(--bg4);color:var(--txt)}

/* 帮助弹窗 */
#help-modal{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;justify-content:center;align-items:center;z-index:1000;
}
#help-modal.show{display:flex}
.help-content{
  background:var(--bg2);border:1px solid var(--acc);
  border-radius:12px;width:90%;max-width:700px;max-height:85vh;
  overflow:hidden;display:flex;flex-direction:column;
}
.help-header{

  display:flex;align-items:center;justify-content:space-between;
}
.help-title{font-size:14px;font-weight:700;color:var(--txt)}
.help-close{

}

.help-body{

}
.help-section{margin-bottom:16px}
.help-section-title{
  font-size:12px;font-weight:700;color:var(--acc2);
  margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.help-item{
  background:var(--bg3);border-radius:6px;padding:8px 10px;

}

/* ═══════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════ */
.medium-panel{}

.medium-label{font-size:9px;color:var(--txt2);width:44px;flex-shrink:0}
.phase-ring-wrap{position:relative;width:44px;height:44px;flex-shrink:0}
.phase-ring-svg{width:44px;height:44px;transform:rotate(-90deg)}
.phase-ring-bg{fill:none;stroke:var(--bg4);stroke-width:4}
.phase-ring-fill{fill:none;stroke:var(--medium);stroke-width:4;stroke-linecap:round;
  transition:stroke-dasharray .6s ease, stroke .4s}
.phase-ring-text{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--medium);pointer-events:none
}
.medium-state-badge{

}

}
@keyframes xinzhaiBlink{0%,100%{opacity:1}50%{opacity:.6}}

/* 九卦降熵进度条 */
.hexagram-section{}
.hexagram-steps{display:flex;gap:2px;margin-bottom:6px}
.hex-step{
  flex:1;height:16px;border-radius:3px;background:var(--bg4);border:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:center;font-size:7px;color:var(--txt3);
  transition:all .4s;cursor:pointer;
}
.hex-step.active{background:var(--medium);border-color:var(--medium);color:#000;font-weight:700}
.hex-step.done{background:var(--xinzhai);border-color:var(--xinzhai);color:#000}
.hexagram-current{
  display:flex;align-items:center;gap:8px;
  background:var(--bg3);border-radius:6px;padding:6px 8px;
}
.hexagram-glyph{font-size:18px;color:var(--medium)}
.hexagram-info{flex:1}
.hexagram-name{font-size:10px;font-weight:700;color:var(--txt)}
.hexagram-meaning{font-size:9px;color:var(--txt2);margin-top:1px}

/* Sc降熵进度 */

.sc-bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.sc-bar-fill{height:100%;background:var(--sc);border-radius:3px;transition:width .6s ease}
.sc-bar-fill.xinzhai{background:var(--xinzhai)}
.sc-bar-val{font-size:9px;color:var(--txt2);width:30px;text-align:right}

/* 四象模态卡片样式 */
.four-mode-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.mode-card{
  background:var(--bg3);border-radius:8px;padding:8px;

}
.mode-card:hover{border-color:var(--txt3)}

.mode-status{font-size:8px;color:var(--txt3);margin-top:2px}
.mode-desc{font-size:9px;color:var(--txt2);line-height:1.4;padding:6px;background:var(--bg3);border-radius:6px}

/* 觉醒度环形 */
.awakening-ring-wrap{width:50px;height:50px;flex-shrink:0}
.awakening-ring-svg{transform:rotate(-90deg)}
.awakening-ring-fill{stroke:var(--gold);stroke-width:4;fill:none;stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset .8s ease}
.awakening-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:var(--gold)}

/* 认知测试进度条 */

.chen-test-scores{margin-top:8px}
.score-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:9px;color:var(--txt2)}
.score-bar{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}

.comp-step-dot.active{background:#34d399}
.comp-step-dot.inactive{background:#6b7280}
.comp-step-label{flex:1;color:var(--txt2)}

/* 上下文完整度 */
.context-completeness{margin:4px 0;padding:4px 6px;background:var(--bg3);border-radius:4px}
.ctx-formula{font-size:7px;color:var(--txt3);font-family:monospace;text-align:center;padding:2px 0}

/* 模型路由可视化 */
.router-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 5px;border-radius:8px;font-size:7px;font-weight:600}
.router-badge.reasoning{background:rgba(139,92,246,.15);color:#8b5cf6}
.router-badge.fast{background:rgba(59,130,246,.15);color:#3b82f6}
.router-badge.multimodal{background:rgba(236,72,153,.15);color:#ec4899}
.router-badge.code{background:rgba(34,211,238,.15);color:#22d3ee}
.router-badge.creative{background:rgba(251,191,36,.15);color:#fbbf24}

/* Obsidian导出状态 */
.obsidian-status{margin:4px 0;padding:4px 6px;background:var(--bg3);border-radius:4px}
.obsidian-link{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:7px}
.obsidian-link-icon{color:var(--amber)}
.obsidian-link-text{color:var(--txt2)}

/* OAuth服务状态 */
.oauth-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.oauth-service{background:var(--bg3);border-radius:4px;padding:3px 6px;font-size:7px;text-align:center}
.oauth-service.connected{color:var(--green)}
.oauth-service.pending{color:var(--amber)}
.oauth-service.disconnected{color:var(--txt3)}

/* 零训练期指示器 */
.cold-start-indicator{display:flex;align-items:center;gap:6px;margin:4px 0;padding:4px 6px;background:var(--bg3);border-radius:4px;font-size:8px}
.cold-start-dot{width:8px;height:8px;border-radius:50%}
.cold-start-dot.ready{background:#34d399;box-shadow:0 0 4px #34d399}
.cold-start-dot.building{background:#fbbf24;animation:pulse 1s infinite}
.cold-start-dot.waiting{background:#6b7280}

/* Sync同步状态 */
/* ══════════════════════════════════════════════════════════════
    STN 苏格拉底拓扑网络 — 四分结构布局 (Phase 1-4 完整实现)
    左-右-下三分 + 全局浮层
   ══════════════════════════════════════════════════════════════ */

/* 全局布局：顶栏 + STN主体 + 底部控制台 */
#app{
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}

/* STN主体：左(森林) + 中(工作区) + 右(DAG) */
#stn-main{
  flex:1;display:flex;overflow:hidden;position:relative;
}

/* ══════════════════════════════════════════════════════════════
   左侧：思维森林视图 (Forest View) — L3前物理层
   ══════════════════════════════════════════════════════════════ */
#forest-panel{
  width:280px;min-width:180px;max-width:400px;
  background:var(--bg2);border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;flex-shrink:0;
  overflow:hidden;position:relative;
  z-index:10;
}
#forest-panel.hidden{display:none!important}
#forest-resizer{
  width:4px;cursor:col-resize;background:transparent;
  position:absolute;right:0;top:0;bottom:0;z-index:11;
  transition:background .15s;
}
#forest-resizer:hover, #forest-resizer.active{background:var(--acc)}

#forest-header{
  padding:8px 10px;border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.forest-title{font-size:11px;font-weight:700;color:var(--txt);flex:1}
.forest-actions{display:flex;gap:3px}
.forest-btn{
  width:22px;height:22px;border:none;border-radius:4px;
  background:var(--bg3);color:var(--txt2);cursor:pointer;
  font-size:10px;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.forest-btn:hover{background:var(--acc);color:#fff}

/* 森林树容器 */
#forest-view{
  flex:1;overflow:auto;padding:6px 4px;position:relative;
}
#forest-view::-webkit-scrollbar{width:4px}
#forest-view::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}

/* 森林节点 */
.forest-node{
  display:flex;align-items:center;gap:4px;
  padding:3px 6px;border-radius:4px;cursor:pointer;
  font-size:10px;color:var(--txt2);transition:all .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-height:22px;
}
.forest-node:hover{background:var(--bg3);color:var(--txt)}
.forest-node.active{background:var(--acc-glow);color:var(--acc2);font-weight:600}
.forest-node-root{color:var(--amber);font-weight:700;font-size:11px}
.forest-node-root::before{content:'⊙ ';color:var(--amber)}
.forest-node-q::before{content:'Q';color:var(--acc);font-weight:700;margin-right:3px;font-size:9px}
.forest-node-a::before{content:'A';color:var(--green);font-weight:700;margin-right:3px;font-size:9px}
.forest-node-goal::before{content:'G';color:var(--goal);font-weight:700;margin-right:3px;font-size:9px}
.forest-node-fork::before{content:'⑂';color:#a855f7;margin-right:2px}
.forest-node-children{margin-left:14px;border-left:1px solid var(--bdr);padding-left:4px}
.forest-collapse-btn{
  width:14px;height:14px;border:none;background:transparent;
  color:var(--txt3);cursor:pointer;font-size:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .12s;
}
.forest-collapse-btn:hover{color:var(--acc2)}
.forest-collapse-btn.collapsed{transform:rotate(-90deg)}

/* 森林视图 SVG 连线层 */
#forest-links-svg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
#forest-view .forest-node{position:relative;z-index:1}

/* ══════════════════════════════════════════════════════════════
   中间：语境工作区 (Context Workspace) — L4认知主体层
   ══════════════════════════════════════════════════════════════ */
#workspace-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  min-width:300px;background:var(--bg);
}
#workspace-header{
  height:38px;padding:0 12px;background:var(--bg2);
  border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.ws-title{font-size:11px;font-weight:600;color:var(--txt);flex:1}
.ws-badge{
  font-size:9px;padding:1px 6px;border-radius:8px;
  background:var(--bg3);color:var(--txt2);
}
.ws-breadcrumb{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--txt3)}
.ws-bc-sep{color:var(--bdr)}
.ws-bc-item{cursor:pointer;color:var(--sky);transition:color .12s}
.ws-bc-item:hover{color:var(--acc2)}

/* 工作区内容区 */
#workspace-content{
  flex:1;overflow-y:auto;padding:10px 14px;
  display:flex;flex-direction:column;gap:8px;
}
#workspace-content::-webkit-scrollbar{width:4px}
#workspace-content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}

/* 工作区消息卡片 */
.ws-msg{
  padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.55;
  max-width:88%;position:relative;
}
.ws-msg-user{
  align-self:flex-end;background:var(--acc-glow);border:1px solid rgba(124,58,237,.25);
  color:var(--txt);
}
.ws-msg-ai{
  align-self:flex-start;background:var(--bg2);border:1px solid var(--bdr);
  color:var(--txt);
}
.ws-msg-meta{font-size:8px;color:var(--txt3);margin-bottom:3px;display:flex;gap:5px;align-items:center}
.ws-msg-actions{
  position:absolute;top:4px;right:4px;display:flex;gap:2px;
  opacity:0;transition:opacity .15s;
}
.ws-msg:hover .ws-msg-actions{opacity:1}
.ws-action-btn{
  width:18px;height:18px;border:none;border-radius:3px;
  background:var(--bg3);color:var(--txt2);cursor:pointer;
  font-size:8px;display:flex;align-items:center;justify-content:center;
  transition:all .12s;
}
.ws-action-btn:hover{background:var(--acc);color:#fff}

/* 工作区输入区 */
#workspace-input-area{
  padding:8px 12px;background:var(--bg2);
  border-top:1px solid var(--bdr);flex-shrink:0;
}
#workspace-input{
  width:100%;background:var(--bg3);border:1px solid var(--bdr);
  border-radius:6px;color:var(--txt);padding:8px 10px;
  font-size:12px;resize:none;height:56px;font-family:inherit;
  line-height:1.5;outline:none;transition:border-color .15s;
}
#workspace-input:focus{border-color:var(--acc)}
#workspace-input-actions{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:4px;
}
.ws-send-btn{
  padding:5px 14px;background:var(--acc);border:none;
  border-radius:5px;color:#fff;font-size:11px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .12s;
}
.ws-send-btn:hover{opacity:.85}
.ws-send-btn:disabled{opacity:.4;cursor:not-allowed}
.ws-input-hint{font-size:9px;color:var(--txt3)}

/* ══════════════════════════════════════════════════════════════
   右侧：DAG关系图面板（保留原功能，可收缩）
   ══════════════════════════════════════════════════════════════ */
#dag-panel{
  width:380px;min-width:200px;max-width:600px;
  background:var(--bg2);border-left:1px solid var(--bdr);
  display:flex;flex-direction:column;flex-shrink:0;
  overflow:hidden;position:relative;
}
#dag-panel.hidden{display:none!important}
#dag-resizer{
  width:4px;cursor:col-resize;background:transparent;
  position:absolute;left:0;top:0;bottom:0;z-index:11;
  transition:background .15s;
}
#dag-resizer:hover, #dag-resizer.active{background:var(--sky)}

/* ══════════════════════════════════════════════════════════════
   底部：流贯控制台 (Ftel Console) — L2投射生成层
   ══════════════════════════════════════════════════════════════ */
#ftel-console{
  height:36px;min-height:36px;
  background:var(--bg2);border-top:1px solid var(--bdr);
  display:flex;align-items:center;gap:8px;
  padding:0 12px;flex-shrink:0;z-index:15;
  font-size:10px;color:var(--txt2);
}
#ftel-console.hidden{display:none!important}
.ftel-section{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ftel-label{font-size:9px;color:var(--txt3);white-space:nowrap}
.ftel-entropy-track{
  width:60px;height:5px;border-radius:3px;background:var(--bg3);
  overflow:hidden;
}
.ftel-entropy-fill{
  height:100%;border-radius:3px;transition:width .4s,background .3s;
  background:var(--green);
}
.ftel-entropy-val{font-size:9px;min-width:28px;text-align:right;color:var(--txt)}
.ftel-progress{
  flex:1;height:5px;border-radius:3px;background:var(--bg3);
  overflow:hidden;position:relative;
}
.ftel-progress-fill{
  height:100%;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .5s ease;width:0%;
}
.ftel-cmd-input{
  width:140px;padding:2px 6px;border:1px solid var(--bdr);
  border-radius:4px;background:var(--bg3);color:var(--txt);
  font-size:10px;font-family:inherit;outline:none;
}
.ftel-cmd-input:focus{border-color:var(--acc)}
.ftel-btn{
  padding:2px 8px;border:1px solid var(--bdr);border-radius:4px;
  background:transparent;color:var(--txt2);font-size:9px;
  cursor:pointer;transition:all .12s;font-family:inherit;
}
.ftel-btn:hover{background:var(--bg3);color:var(--acc)}

/* ══════════════════════════════════════════════════════════════
   全局浮层：本体导航 (Ontology Navigator) — L1本体层
   始终显示当前对话的"核心意图"Root Node
   ══════════════════════════════════════════════════════════════ */
#ontology-nav{
  position:fixed;top:0;left:0;right:0;height:32px;
  background:rgba(9,9,15,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bdr);z-index:100;
  display:flex;align-items:center;padding:0 14px;gap:8px;
  font-size:10px;
  transform:translateY(-100%);transition:transform .25s ease;
}
#ontology-nav.visible{transform:translateY(0)}
.onto-label{color:var(--txt3);white-space:nowrap}
.onto-root{
  color:var(--amber);font-weight:600;cursor:pointer;
  padding:1px 6px;border-radius:4px;transition:background .12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px;
  display:inline-block;
}
.onto-root:hover{background:var(--bg3)}
.onto-spacer{flex:1}
.onto-toggle{
  background:none;border:none;color:var(--txt3);cursor:pointer;
  font-size:11px;padding:2px 4px;border-radius:3px;transition:all .12s;
}
.onto-toggle:hover{color:var(--acc2);background:var(--bg3)}

/* ══════════════════════════════════════════════════════════════
   STN 布局切换按钮（顶栏内）
   ══════════════════════════════════════════════════════════════ */
.stn-toggle-btn{
  padding:3px 8px;border:1px solid var(--bdr);border-radius:4px;
  background:var(--bg3);color:var(--txt2);font-size:9px;
  cursor:pointer;transition:all .15s;font-family:inherit;
}
.stn-toggle-btn.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.stn-toggle-btn:hover{color:var(--txt)}

/* 顶栏适配STN模式 */
#topbar.stn-mode{padding-left:8px}
#topbar.stn-mode .logo-wrap .title{font-size:13px}

/* ══════════════════════════════════════════════════════════════
   思维森林视图中的节点类型图标（SVG 小符号）
   ══════════════════════════════════════════════════════════════ */
.forest-node-icon{
  width:14px;height:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:700;border-radius:3px;
}
.forest-node-icon.q{background:rgba(124,58,237,.2);color:var(--acc2)}
.forest-node-icon.a{background:rgba(16,185,129,.15);color:var(--green)}
.forest-node-icon.g{background:rgba(251,191,36,.15);color:var(--goal)}
.forest-node-icon.s{background:rgba(6,182,212,.15);color:var(--grow)}
.forest-node-icon.e{background:rgba(249,115,22,.15);color:#f97316}

/* 森林视图中的活跃路径高亮 */
.forest-node.in-path{color:var(--acc2)}
.forest-node.in-path::before{text-shadow:0 0 6px var(--acc-glow)}

/* 分叉指示条 */
.forest-fork-indicator{
  width:3px;height:100%;background:var(--purple);border-radius:2px;
  position:absolute;left:0;top:0;
}

/* ══════════════════════════════════════════════════════════════
   响应式：小屏幕自动隐藏森林视图
   ══════════════════════════════════════════════════════════════ */
@media(max-width:900px){
  #forest-panel{display:none}
  #dag-panel{display:none}
}
</style>
</head>
<body>
<div id="app">  <!-- ══════════════════════════════════════════════════════════
       全局浮层：本体导航 (Ontology Navigator) — L1本体层
       始终显示当前对话的"核心意图"Root Node
   ══════════════════════════════════════════════════════════ -->
  <div id="ontology-nav">
    <span class="onto-label">◆ 本体导航：</span>
    <span class="onto-root" id="onto-root" title="点击回到根节点">未初始化</span>
    <span class="onto-spacer"></span>
    <button class="onto-toggle" onclick="toggleOntoNav()" title="收起本体导航">✕</button>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       顶栏（STN模式精简版）
   ══════════════════════════════════════════════════════════ -->
  <div id="topbar" class="stn-mode">
    <div class="logo-wrap">
      <span class="logo">🔮</span>
      <span class="title">Taiyi-AGI · STN</span>
      <span class="version-badge">v7.21</span>
      <span class="theory-badge">STN苏格拉底拓扑网络</span>
    </div>
    <div class="dot-ok" id="status-dot"></div>
    <span class="resp-timer" id="resp-timer"></span>
    <span class="spacer"></span>
    <!-- STN视图切换 -->
    <div class="header-actions" style="display:flex;gap:4px">
      <button class="stn-toggle-btn active" data-panel="forest" onclick="toggleSTNPanel('forest',this)" title="思维森林视图">🌲 森林</button>
      <button class="stn-toggle-btn" data-panel="dag" onclick="toggleSTNPanel('dag',this)" title="DAG关系图">🔗 DAG</button>
      <button class="stn-toggle-btn" data-panel="console" onclick="toggleSTNPanel('console',this)" title="流贯控制台">�底控制台</button>
    </div>
    <button class="btn-reset" id="btn-reset" title="重置对话">↺ 重置</button>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       STN主体：左(森林) + 中(工作区) + 右(DAG)
   ══════════════════════════════════════════════════════════ -->
  <div id="stn-main">

    <!-- 左侧：思维森林视图 (Forest View) — L3前物理层 -->
    <div id="forest-panel">
      <div id="forest-header">
        <span class="forest-title">🌲 思维森林</span>
        <div class="forest-actions">
          <button class="forest-btn" onclick="forestExpandAll()" title="展开全部">⊞</button>
          <button class="forest-btn" onclick="forestCollapseAll()" title="折叠全部">⊟</button>
          <button class="forest-btn" onclick="forestScrollToActive()" title="定位到活跃节点">⊙</button>
        </div>
      </div>
      <!-- 搜索过滤 -->
      <div style="padding:4px 8px;border-bottom:1px solid var(--bdr);flex-shrink:0">
        <input type="text" id="forest-search" placeholder="搜索节点..."
               style="width:100%;background:var(--bg3);border:1px solid var(--bdr);
                      border-radius:4px;color:var(--txt);font-size:9px;
                      padding:3px 6px;font-family:inherit;outline:none"
               oninput="forestFilter(this.value)">
      </div>
      <!-- 面包屑导航 -->
      <div id="stn-breadcrumb">
        <span class="stn-bc-item active" onclick="forestGoToRoot()">Root</span>
      </div>
      <!-- 森林树容器 -->
      <div id="forest-view">
        <div class="forest-empty-state" id="forest-empty" style="text-align:center;padding:20px 10px;color:var(--txt3);font-size:10px">
          🌱 发送消息后此处显示<br>对话树状结构
        </div>
        <svg id="forest-links-svg"></svg>
        <div id="forest-tree"></div>
      </div>
      <!-- 森林底部统计 -->
      <div style="padding:4px 8px;border-top:1px solid var(--bdr);flex-shrink:0;
                   font-size:8px;color:var(--txt3);display:flex;justify-content:space-between">
        <span id="forest-stats">节点: 0</span>
        <span id="forest-depth">深度: 0</span>
      </div>
      <!-- 拖拽调整宽度 -->
      <div id="forest-resizer"></div>
    </div>

    <!-- 中间：语境工作区 (Context Workspace) — L4认知主体层 -->
    <div id="workspace-panel">
      <div id="workspace-header">
        <span class="ws-breadcrumb" id="ws-breadcrumb">
          <span class="ws">Root</span>
        </span>
        <span class="spacer"></span>
        <span class="ws-badge" id="ws-mode-badge">对话模式</span>
      </div>
      <!-- 工作区内容：对话历史 -->
      <div id="workspace-content">
        <div id="ws-empty-state" style="text-align:center;padding:40px 20px;color:var(--txt3);font-size:12px">
          <div style="font-size:36px;margin-bottom:12px;opacity:.4">💬</div>
          开始对话，STN将记录<br>完整的思维拓扑结构
        </div>
        <div id="ws-messages"></div>
      </div>
      <!-- 工作区输入区 -->
      <div id="workspace-input-area">
        <div id="ws-mode-tabs" style="display:flex;gap:3px;margin-bottom:4px">
          <button class="input-tab active" data-mode="chat" onclick="wsSwitchMode('chat',this)">💬 对话</button>
          <button class="input-tab" data-mode="goal" onclick="wsSwitchMode('goal',this)">🎯 Goal</button>
          <button class="input-tab" data-mode="fork" onclick="wsSwitchMode('fork',this)">⑂ 分叉</button>
        </div>
        <textarea id="workspace-input" placeholder="输入消息... (Shift+Enter 换行，Enter 发送)"
                  onkeydown="wsInputKeyDown(event)"></textarea>
        <div id="workspace-input-actions">
          <span class="ws-input-hint" id="ws-input-hint">Enter 发送 · Shift+Enter 换行</span>
          <button class="ws-send-btn" id="ws-send-btn" onclick="wsSendMessage()">发送 ➤</button>
        </div>
        <!-- 分叉模式提示 -->
        <div id="ws-fork-hint" style="display:none;padding:4px 8px;background:rgba(168,85,247,.1);
                    border:1px solid rgba(168,85,247,.3);border-radius:4px;
                    font-size:9px;color:#a855f7;margin-top:4px">
          ✦ 分叉模式：输入将从选中节点创建新对话分支
        </div>
      </div>
    </div>

    <!-- 右侧：DAG关系图面板（可隐藏） -->
    <div id="dag-panel">
      <div class="right-header">
        <span class="right-icon">🔗</span>
        <span class="right-title">DAG 关系图</span>
        <span class="rel-badge" id="dag-count">0</span>
        <span class="spacer"></span>
        <button class="btn-dag-fullscreen" onclick="toggleDAGFullscreen()" title="全屏DAG">⛶</button>
      </div>
      <div id="dag-container">
        <svg id="dag-svg"></svg>
        <div class="dag-empty-state" id="dag-empty-state">
          <div class="dag-empty-icon">🔗</div>
          <div class="dag-empty-text">DAG关系图将在此显示</div>
        </div>
      </div>
      <div id="dag-footer">
        <div class="dag-stat"><div class="dag-dot dot-q"></div><span>Q: <span id="dag-q-count">0</span></span></div>
        <div class="dag-stat"><div class="dag-dot dot-a"></div><span>A: <span id="dag-a-count">0</span></span></div>
        <div class="dag-stat"><div class="dag-dot dot-follow"></div><span>分支: <span id="dag-fork-count">0</span></span></div>
      </div>
      <!-- 拖拽调整宽度 -->
      <div id="dag-resizer"></div>
    </div>

  </div><!-- /#stn-main -->

  <!-- ══════════════════════════════════════════════════════════
       底部：流贯控制台 (Ftel Console) — L2投射生成层
   ══════════════════════════════════════════════════════════ -->
  <div id="ftel-console">
    <div class="ftel-section" title="上下文进度（已用/总容量）">
      <span class="ftel-label">CTX</span>
      <div class="ftel-progress">
        <div class="ftel-progress-fill" id="ftel-ctx-fill" style="width:0%"></div>
      </div>
      <span class="ftel-entropy-val" id="ftel-ctx-val">0%</span>
    </div>
    <div class="ftel-section" title="系统熵值（越低越稳定）">
      <span class="ftel-label">S</span>
      <div class="ftel-entropy-track">
        <div class="ftel-entropy-fill" id="ftel-entropy-fill" style="width:20%"></div>
      </div>
      <span class="ftel-entropy-val" id="ftel-entropy-val">0.20</span>
    </div>
    <div class="console-btns">
      <button class="console-btn" onclick="ftelSummarize()" title="一键总结当前对话">📝 总结</button>
      <button class="console-btn" onclick="ftelDebate()" title="发起诘辩（ELENCHUS）">⚔️ 诘辩</button>
      <button class="console-btn" onclick="ftelIntegrate()" title="整合当前对话为知识">🔥 整合</button>
    </div>
    <input type="text" class="console-cmd-input" id="ftel-cmd-input"
           placeholder="输入命令：/fork /summarize /debate /integrate /help"
           onkeydown="ftelCmdKeyDown(event)">
    <span class="console-status" id="ftel-status">就绪</span>
  </div>

</body>
</html>
