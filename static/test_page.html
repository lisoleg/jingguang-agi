<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AGI12 测试页</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #status { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .ok { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    button { padding: 10px 20px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>AGI12 JavaScript 诊断测试</h1>
  
  <div id="status">测试中...</div>
  
  <button id="testBtn">点击测试</button>
  <div id="testResult"></div>
  
  <script>
    document.getElementById('status').className = 'ok';
    document.getElementById('status').textContent = '✅ DOMContentLoaded 执行成功!';
    
    document.getElementById('testBtn').addEventListener('click', function() {
      document.getElementById('testResult').textContent = '✅ 按钮点击成功!';
      console.log('Test button clicked');
    });
    
    console.log('测试脚本加载完成');
  </script>
</body>
</html>
